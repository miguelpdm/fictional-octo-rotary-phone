<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0b0d10">
  <meta name="description" content="Resumen de prensa diario de Miguel">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Prensa">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <title>📰 Prensa</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png" sizes="180x180">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./styles.css">
  <script>
    (function () {
      try {
        var key = "prensa-theme";
        var saved = localStorage.getItem(key);
        var theme = saved === "light" || saved === "dark"
          ? saved
          : (window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
        document.documentElement.setAttribute("data-theme", theme);
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute("content", theme === "light" ? "#f3f5f8" : "#0b0d10");
      } catch (e) {
        document.documentElement.setAttribute("data-theme", "dark");
      }
    })();
  </script>
</head>
<body>
  <main class="app" id="app">
    <header>
      <div class="title-row">
        <h1>📰 Prensa</h1>
        <div class="header-actions">
          <button class="theme-btn" id="themeBtn" type="button" aria-label="Modo claro" title="Modo claro">
            <span class="icon-sun" aria-hidden="true">☀️</span>
            <span class="icon-moon" aria-hidden="true">🌙</span>
          </button>
          <a class="site-link" href="../cartera/">💼 Cartera</a>
        </div>
      </div>
      <p class="lead">Resumen diario. Enlaces a la fuente original.</p>
    </header>

    <nav class="day-nav" aria-label="Edición">
      <div class="day-row">
        <button type="button" class="nav-btn" id="prevBtn" aria-label="Día anterior">‹</button>
        <p class="day-label" id="dayLabel">Sin ediciones</p>
        <button type="button" class="nav-btn" id="nextBtn" aria-label="Día siguiente">›</button>
      </div>
      <label class="archive-label" for="dateSelect">Archivo</label>
      <select id="dateSelect" aria-label="Elegir fecha del archivo"></select>
    </nav>

    <p class="state" id="status" hidden></p>
    <div id="sections" class="sections"></div>
  </main>
  <script src="./app.js"></script>
</body>
</html>
